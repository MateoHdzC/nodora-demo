# Publica la demo en GitHub Pages en cada push a main.
# Corre en Linux, así que el bug de export de Next en Windows no aplica.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy a la vez; si llega otro push, no corta el que está en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Toma la versión de pnpm del campo "packageManager" de package.json
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - name: Build estático bajo /nodora-demo
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /nodora-demo

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
